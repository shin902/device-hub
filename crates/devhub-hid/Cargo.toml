[package]
name = "devhub-hid"
version = "0.1.0"
edition = "2021"
description = "HID transport layer for Device HUB. Implements devhub_core::backend over real hardware."

[dependencies]
devhub-core = { path = "../devhub-core" }
# macOS: hidapi は既定で排他オープン (seize) し、キーボード collection を持つ機種
# (G502 HERO if=1 等) が 0xE00002E2 not permitted で開けない → 共有オープン。Windows では no-op。
hidapi = { version = "2", features = ["macos-shared-device"] }
serde_json = "1"
# 公式 configurator (hub.xsyd.top) のエクスポート復号 (CryptoJS AES / EVP_BytesToKey)
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
base64 = "0.22"
